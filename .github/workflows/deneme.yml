#.github/workflows/sync-release.yml

name: Sync and Release to Public Repository

# İş akışını, yalnızca 'release' dalına 'v' ile başlayan bir etiket gönderildiğinde tetikle
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release'

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Adım: Özel deponun kodunu ve tam geçmişini çek
      - name: Check out private repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      # 2. Adım: Kodu halka açık depoya zorla it (force push)
      - name: Force push to public repository
        run: |
          # Git işlemlerini yapacak bot için kullanıcı bilgilerini ayarla
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Halka açık depoyu, kimlik doğrulaması için PAT ile birlikte bir remote olarak ekle
          git remote add public_repo https://x-access-token:${{ secrets.PUBLIC_REPO_PAT }}@github.com/TempOrganizationTest/public-repo.git
          
          # Varsayılan GITHUB_TOKEN'ın neden olduğu potansiyel kimlik doğrulama çakışmasını önle
          git config --unset-all http.https://github.com/.extraheader
          
          # Özel deponun 'release' dalını, halka açık deponun 'main' dalına zorla it
          git push public_repo release:main --force

      # 3. Adım: Halka açık depoda yeni bir GitHub Sürümü oluştur
      - name: Create release on public repository
        id: create_release # Bu adıma bir ID vererek çıktılarına erişim sağla
        uses: ncipollo/release-action@v1.20.0
        with:
          # Halka açık depoya erişim için PAT'ı kullan
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          # Hedef deponun sahibini ve adını belirt
          owner: TestDumpAccount
          repo: public-repo
          # Tetikleyici etiketi sürüm etiketi olarak kullan
          tag: ${{ github.ref_name }}
          # Otomatik olarak sürüm notları oluştur
          generateReleaseNotes: true
          # Aynı etikete sahip bir sürüm varsa güncelle
          allowUpdates: true
   
