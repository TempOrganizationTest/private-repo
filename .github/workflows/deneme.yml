name: Sync to Public Repo and Release

on:
  push:
    tags:
      - 'v*' # v ile başlayan tag'ler için tetiklenir

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Private repo'daki kodu checkout et
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Public repo'ya push yap (commit history'siz)
      - name: Push to Public Repo
        run: |
          # Public repo'yu geçici dizine klonla
          git clone https://TestDumpAccount:${{ secrets.PUBLIC_REPO_PAT }}@github.com/TempOrganizationTest//public-repo.git public-repo
          
          # .github dizini hariç tüm dosyaları kopyala
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -exec cp -r {} public-repo/ \;
          
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release: ${{ github.ref_name }}"
          git tag ${{ github.ref_name }}
          git push origin main --force
          git push origin --tags

      # 3. GitHub Release Oluştur
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Automated release from private repository
            Version: ${{ github.ref_name }}
            Date: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false