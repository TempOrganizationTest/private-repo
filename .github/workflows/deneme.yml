name: Sync to Public Repo and Release

on:
  push:
    branches:
      - 'release'
    tags:
      - 'v*'

jobs:
  sync-and-release:
    if: (github.event.base_ref == 'refs/heads/release' && github.ref_type == 'tag') || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Validate Tag Existence
        id: validate_tag
        run: |
          LATEST_COMMIT_SHA=$(git rev-parse HEAD)
          TAGS=$(git tag --points-at $LATEST_COMMIT_SHA)
          
          if [ -z "$TAGS" ]; then
            echo "❌ Error: No tag found for the latest commit. Please create and push a tag."
            echo "To create a tag: git tag -a v1.0.0 -m 'Release message' && git push origin v1.0.0"
            exit 1
          fi
          
          # Get the first tag (there can be more than one tag in a commit)
          TAG=$(echo "$TAGS" | head -n1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Found tag: $TAG"

      - name: Get Tag Annotation Message
        id: get_tag_message
        run: |
          
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "${{ steps.validate_tag.outputs.tag }}" 2>/dev/null)

          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="Automated release from private repository\n\nVersion: ${{ steps.validate_tag.outputs.tag }}"
          fi
          
          FORMATTED_MESSAGE=$(echo -e "$TAG_MESSAGE")
          ESCAPED_MESSAGE=$(echo -e "$TAG_MESSAGE" | jq -R -s -c .)
          echo "tag_message=$ESCAPED_MESSAGE" >> $GITHUB_OUTPUT

      - name: Clone Public Repository
        run: |
          git clone https://TestDumpAccount:${{ secrets.PUBLIC_REPO_PAT }}@github.com/TempOrganizationTest/public-repo.git public-repo-temp

      - name: Prepare Public Repository
        run: |
          # Mevcut dosyaları temizle (.git klasörü hariç)
          cd public-repo-temp
          find . -maxdepth 1 -not -name '.' -not -name '.git' -exec rm -rf {} +
          
          # Dosyaları private repo'dan public repo'ya kopyala
          cd ..
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -not -name 'public-repo-temp' -exec cp -r {} public-repo-temp/ \;

      - name: Configure Git for Public Repo
        run: |
          cd public-repo-temp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push to Public Repo
        run: |
          cd public-repo-temp
          git add .
          git commit -m "release: ${{ steps.validate_tag.outputs.tag }}"
          git tag ${{ steps.validate_tag.outputs.tag }}
          git push origin main
          git push origin --tags 

      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ steps.validate_tag.outputs.tag }}
          name: Release ${{ steps.validate_tag.outputs.tag }}
          body:  ${{ fromJSON(steps.get_tag_message.outputs.tag_message) }}
          repository: TempOrganizationTest/public-repo
          draft: false
          prerelease: false
          make_latest: 'true'
          token: ${{ secrets.PUBLIC_REPO_PAT }}
