name: Sync to Public Repo and Release

on:
  push:
    tags:
      - 'v*' # v ile başlayan tag'ler için tetiklenir

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Private repo'daki kodu checkout et
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Public repo'ya push yap (commit history'siz)
      - name: Push to Public Repo
        run: |
          # Public repo'yu geçici dizine klonla
          git clone https://TestDumpAccount:${{ secrets.PUBLIC_REPO_PAT }}@github.com/TempOrganizationTest//public-repo.git public-repo
          
          # .github dizini hariç tüm dosyaları kopyala
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -exec cp -r {} public-repo/ \;
          
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release: ${{ github.ref_name }}"
          git tag ${{ github.ref_name }}
          git push origin main --force
          git push origin --tags

      - name: Create Release via API
        run: |
          # API ile release oluştur
          curl -X POST \
            -H "Authorization: token ${{ secrets.PUBLIC_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/TempOrganizationTest/public-repo/releases" \
            -d '{
              "tag_name": "${{ github.ref_name }}",
              "name": "Release ${{ github.ref_name }}",
              "body": "Automated release from private repository\n\nVersion: ${{ github.ref_name }}\nDate: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")",
              "draft": false,
              "prerelease": false,
              "target_commitish": "main"
            }'
              
          # Release'in oluşturulduğunu kontrol et
          curl -H "Authorization: token ${{ secrets.PUBLIC_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/TempOrganizationTest/public-repo/releases/tags/${{ github.ref_name }}"