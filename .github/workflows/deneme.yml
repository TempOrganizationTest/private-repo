name: Sync to Public Repo and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  sync-and-release:
    if: github.event.base_ref == 'refs/heads/release' || contains(github.event.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Tag Annotation Message
        id: get_tag_message
        run: |
          git tag -d "${{ github.ref_name }}" 2>/dev/null || true
          git fetch --tags --force
          
          TAG_MESSAGE=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${{ github.ref_name }}" 2>/dev/null)
          
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="Automated release from private repository\n\nVersion: ${{ github.ref_name }}"
          fi
          
          # Debug için mesajı göster
          echo "Tag message:"
          echo "$TAG_MESSAGE"
          
          ESCAPED_MESSAGE=$(echo -e "$TAG_MESSAGE" | jq -R -s -c .)
          echo "tag_message=$ESCAPED_MESSAGE" >> $GITHUB_OUTPUT

      - name: Clone Public Repository
        run: |
          git clone https://TestDumpAccount:${{ secrets.PUBLIC_REPO_PAT }}@github.com/TempOrganizationTest/public-repo.git public-repo-temp

      - name: Prepare Public Repository
        run: |
          # Mevcut dosyaları temizle (.git klasörü hariç)
          cd public-repo-temp
          find . -maxdepth 1 -not -name '.' -not -name '.git' -exec rm -rf {} +
          
          # Dosyaları private repo'dan public repo'ya kopyala
          cd ..
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -not -name 'public-repo-temp' -exec cp -r {} public-repo-temp/ \;

      - name: Configure Git for Public Repo
        run: |
          cd public-repo-temp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push to Public Repo
        run: |
          cd public-repo-temp
          git add .
          git commit -m "release: ${{ github.ref_name }}"
          git tag ${{ github.ref_name }}
          git push origin main --force
          git push origin --tags 

      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.get_tag_message.outputs.tag_message }}
          repository: TempOrganizationTest/public-repo
          draft: false
          prerelease: false
          make_latest: 'true'
          token: ${{ secrets.PUBLIC_REPO_PAT }}
