name: Sync to Public Repo and Release

on:
  push:
    tags:
      - 'v*' # v ile başlayan tag'ler için tetiklenir

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Private repo'daki kodu checkout et
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Public repo'ya push yap (commit history'siz)
      - name: Push to Public Repo
        run: |
          # Public repo'yu geçici dizine klonla
          git clone https://TestDumpAccount:${{ secrets.PUBLIC_REPO_PAT }}@github.com/TempOrganizationTest//public-repo.git public-repo
          
          # .github dizini hariç tüm dosyaları kopyala
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '.github' -exec cp -r {} public-repo/ \;
          
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release: ${{ github.ref_name }}"
          git tag ${{ github.ref_name }}
          git push origin main --force
          git push origin --tags

      - name: Create Release using GitHub CLI
        run: |
          cd public-repo
          echo "${{ secrets.PUBLIC_REPO_PAT }}" | gh auth login --with-token

          gh release create ${{ github.ref_name }} \
            --title="Release ${{ github.ref_name }}" \
            --notes="Automated release from private repository" \
            --target=main
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}

      - name: Verify Release Created
        run: |
          echo "${{ secrets.PUBLIC_REPO_PAT }}" | gh auth login --with-token
          gh release view ${{ github.ref_name }} --repo=TempOrganizationTest/public-repo
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}